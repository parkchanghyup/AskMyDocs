<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG System</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #ffffff;
            --secondary-bg: #f8f9fa;
            --primary-color: #5a67d8;
            --primary-hover: #4c51bf;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --text-tertiary: #6b7280;
            --border-color: #e5e7eb;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --user-message-bg: #eff6ff;
            --bot-message-bg: #ffffff;
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --transition: all 0.2s ease;
            --max-width: 900px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 16px;
            line-height: 1.5;
            color: var(--text-primary);
            background-color: var(--secondary-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
        }

        header {
            background-color: var(--primary-bg);
            padding: 1rem;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .header-content {
            max-width: var(--max-width);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-primary);
        }

        .logo-icon {
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: var(--max-width);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background-color: var(--primary-bg);
            box-shadow: var(--shadow-md);
            border-radius: var(--radius-md);
            margin-top: 1rem;
            margin-bottom: 1rem;
            overflow: hidden;
            position: relative;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 14rem);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
            scroll-behavior: smooth;
        }

        .message-group {
            padding: 0.5rem 1.5rem;
            display: flex;
            gap: 1rem;
            transition: var(--transition);
        }

        .message-group:hover {
            background-color: rgba(0, 0, 0, 0.01);
        }

        .user-message-group {
            background-color: var(--user-message-bg);
        }

        .bot-message-group {
            background-color: var(--bot-message-bg);
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .avatar {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            background-color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.25rem;
            flex-shrink: 0;
            margin-top: 0.25rem;
        }

        .bot-avatar {
            background-color: white;
            border: 2px solid var(--border-color);
            color: var(--primary-color);
        }

        .message-content {
            flex: 1;
            padding: 0.5rem 0;
            max-width: calc(100% - 4rem);
        }

        .message-sender {
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: var(--text-primary);
        }

        .message-text {
            color: var(--text-primary);
            line-height: 1.6;
        }

        .message-text p {
            margin-bottom: 1rem;
        }

        .message-text p:last-child {
            margin-bottom: 0;
        }

        .message-text pre {
            background-color: var(--secondary-bg);
            padding: 1rem;
            border-radius: var(--radius-sm);
            overflow-x: auto;
            margin: 1rem 0;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.875rem;
            line-height: 1.5;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .message-text code {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.875rem;
            padding: 0.2rem 0.4rem;
            border-radius: var(--radius-sm);
            background-color: var(--secondary-bg);
            color: var(--text-primary);
        }

        .message-actions {
            display: flex;
            margin-top: 1rem;
            gap: 0.75rem;
        }

        .action-button {
            background: none;
            border: none;
            color: var(--text-tertiary);
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.375rem 0.75rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.375rem;
            transition: var(--transition);
        }

        .action-button:hover {
            background-color: var(--secondary-bg);
            color: var(--primary-color);
        }

        .action-panel {
            margin-top: 1rem;
            background-color: var(--secondary-bg);
            padding: 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            color: var(--text-secondary);
            display: none;
        }

        .sources-list {
            list-style: disc;
            padding-left: 1.5rem;
            margin-top: 0.5rem;
        }

        .sources-list li {
            margin-bottom: 0.375rem;
        }

        .thinking-content {
            white-space: pre-line;
        }

        .input-container {
            padding: 1rem 1.5rem;
            background-color: var(--primary-bg);
            border-top: 1px solid var(--border-color);
            position: sticky;
            bottom: 0;
        }

        .input-area {
            display: flex;
            align-items: flex-end;
            gap: 0.75rem;
            background-color: var(--primary-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 0.75rem 1rem;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .input-area:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(90, 103, 216, 0.2);
        }

        #user-input {
            flex: 1;
            min-height: 24px;
            max-height: 200px;
            padding: 0.25rem 0;
            border: none;
            outline: none;
            background: transparent;
            resize: none;
            font-family: inherit;
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text-primary);
        }

        #user-input::placeholder {
            color: var(--text-tertiary);
        }

        #send-button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: var(--transition);
        }

        #send-button:hover {
            background-color: var(--primary-hover);
        }

        #send-button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
        }

        .loading-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 0;
        }

        .loading-dots {
            display: flex;
            gap: 0.25rem;
        }

        .loading-dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 50%;
            background-color: var(--primary-color);
            opacity: 0.4;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        footer {
            padding: 1rem;
            text-align: center;
            color: var(--text-tertiary);
            font-size: 0.875rem;
            border-top: 1px solid var(--border-color);
            background-color: var(--primary-bg);
        }

        @media (max-width: 768px) {
            main {
                margin: 0;
                border-radius: 0;
                max-width: 100%;
            }

            .chat-container {
                min-height: calc(100vh - 8rem);
            }

            .message-group {
                padding: 0.5rem 1rem;
            }

            .input-container {
                padding: 0.75rem 1rem;
            }

            header, footer {
                padding: 0.75rem;
            }
        }

        .action-container {
            margin-top: 1rem;
        }

        .action-panel {
            margin-top: 0.5rem;
            background-color: var(--secondary-bg);
            padding: 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            color: var(--text-secondary);
            display: none;
        }

        .message-actions {
            display: flex;
            margin-top: 1rem;
        }

        .action-containers {
            width: 100%;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-hard-hat"></i>
                    </div>
                    <span id="system-title"></span>
                </div>
            </div>
        </header>

        <main>
            <div class="chat-container">
                <div class="chat-messages" id="chat-messages">
                    <!-- 메시지들이 여기에 동적으로 추가됩니다 -->
                </div>
                <div class="input-container">
                    <div class="input-area">
                        <textarea id="user-input" placeholder="Ask me anything..." rows="1"></textarea>
                        <button id="send-button" disabled>
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            © AskMyDocs
        </footer>
    </div>

    <script>
        // 시스템 설정 변수 (기본값)
        let SYSTEM_TITLE = 'Please question about docs';
        let INITIAL_MESSAGE = 'Hello.';

        // 페이지 로드 시 설정 로드 및 초기화
        document.addEventListener('DOMContentLoaded', async function() {
            // 서버에서 설정 가져오기
            try {
                const response = await fetch('/api/config');
                if (response.ok) {
                    const config = await response.json();
                    SYSTEM_TITLE = config.system_title;
                    INITIAL_MESSAGE = config.initial_message;
                }
            } catch (error) {
                console.error('설정을 불러오는데 실패했습니다:', error);
            }

            // 제목 설정
            document.title = SYSTEM_TITLE;
            document.getElementById('system-title').textContent = SYSTEM_TITLE;

            const chatMessages = document.getElementById('chat-messages');
            const userInput = document.getElementById('user-input');
            const sendButton = document.getElementById('send-button');

            // 초기 메시지 설정
            addBotResponse({
                answer: INITIAL_MESSAGE
            });

            // 텍스트 영역 자동 높이 조절
            function adjustTextareaHeight() {
                userInput.style.height = 'auto';
                userInput.style.height = Math.min(userInput.scrollHeight, 200) + 'px';
            }

            userInput.addEventListener('input', function() {
                adjustTextareaHeight();
                // 입력 내용이 있을 때만 버튼 활성화
                sendButton.disabled = this.value.trim() === '';
            });

            // 메시지 전송 함수
            function sendMessage() {
                const message = userInput.value.trim();
                if (message === '') return;

                // 사용자 메시지 추가
                addUserMessage(message);
                
                // 입력창 초기화
                userInput.value = '';
                userInput.style.height = 'auto';
                userInput.focus();
                sendButton.disabled = true;

                // 로딩 표시
                const loadingGroup = document.createElement('div');
                loadingGroup.className = 'message-group bot-message-group';
                
                const loadingContent = document.createElement('div');
                loadingContent.className = 'message-content';
                
                const botAvatar = document.createElement('div');
                botAvatar.className = 'avatar bot-avatar';
                botAvatar.innerHTML = '<i class="fas fa-robot"></i>';
                
                const loadingContainer = document.createElement('div');
                loadingContainer.className = 'loading-container';
                loadingContainer.innerHTML = `
                    <div class="loading-dots">
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                    </div>
                    <span>생각 중...</span>
                `;
                
                loadingContent.appendChild(loadingContainer);
                loadingGroup.appendChild(botAvatar);
                loadingGroup.appendChild(loadingContent);
                chatMessages.appendChild(loadingGroup);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                // API 호출
                fetch('/api/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query: message }),
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('API 요청 실패');
                    }
                    return response.json();
                })
                .then(data => {
                    // 로딩 제거
                    chatMessages.removeChild(loadingGroup);
                    
                    // 봇 응답 추가
                    addBotResponse(data);
                })
                .catch(error => {
                    // 로딩 제거
                    chatMessages.removeChild(loadingGroup);
                    
                    // 에러 메시지 추가
                    addBotResponse({
                        answer: '죄송합니다. 요청을 처리하는 중 오류가 발생했습니다.'
                    });
                    
                    console.error('Error:', error);
                });
            }

            // 사용자 메시지 추가 함수
            function addUserMessage(text) {
                const messageGroup = document.createElement('div');
                messageGroup.className = 'message-group user-message-group';
                
                const avatar = document.createElement('div');
                avatar.className = 'avatar';
                avatar.innerHTML = '<i class="fas fa-user"></i>';
                
                const messageContent = document.createElement('div');
                messageContent.className = 'message-content';
                
                const messageSender = document.createElement('div');
                messageSender.className = 'message-sender';
                messageSender.textContent = 'User';
                
                const messageText = document.createElement('div');
                messageText.className = 'message-text';
                messageText.innerHTML = `<p>${text}</p>`;
                
                messageContent.appendChild(messageSender);
                messageContent.appendChild(messageText);
                
                messageGroup.appendChild(avatar);
                messageGroup.appendChild(messageContent);
                
                chatMessages.appendChild(messageGroup);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // 봇 응답 추가 함수 (사고 과정 및 출처 포함)
            function addBotResponse(data) {
                const messageGroup = document.createElement('div');
                messageGroup.className = 'message-group bot-message-group';
                
                const avatar = document.createElement('div');
                avatar.className = 'avatar bot-avatar';
                avatar.innerHTML = '<i class="fas fa-robot"></i>';
                
                const messageContent = document.createElement('div');
                messageContent.className = 'message-content';
                
                const messageSender = document.createElement('div');
                messageSender.className = 'message-sender';
                messageSender.textContent = 'assistant';
                
                const messageText = document.createElement('div');
                messageText.className = 'message-text';
                messageText.innerHTML = marked.parse(data.answer);
                
                messageContent.appendChild(messageSender);
                messageContent.appendChild(messageText);
                
                // 액션 버튼 컨테이너 (사고 과정 및 출처가 있는 경우만 생성)
                if (data.thinking || (data.documents && data.documents.length > 0)) {
                    const messageActions = document.createElement('div');
                    messageActions.className = 'message-actions';

                    // 각 액션 버튼과 패널을 포함할 컨테이너
                    const actionContainers = document.createElement('div');
                    actionContainers.className = 'action-containers';
                    
                    // 사고 과정 버튼 및 패널
                    if (data.thinking) {
                        const thinkingContainer = document.createElement('div');
                        thinkingContainer.className = 'action-container';
                        
                        const thinkingButton = document.createElement('button');
                        thinkingButton.className = 'action-button';
                        thinkingButton.innerHTML = '<i class="fas fa-lightbulb"></i> 사고 과정';
                        
                        const thinkingPanel = document.createElement('div');
                        thinkingPanel.className = 'action-panel thinking-panel';
                        
                        const thinkingContent = document.createElement('div');
                        thinkingContent.className = 'thinking-content';
                        thinkingContent.innerHTML = marked.parse(data.thinking.replace(/\n/g, '  \n'));
                        
                        thinkingPanel.appendChild(thinkingContent);
                        
                        thinkingButton.addEventListener('click', function() {
                            // 모든 패널 닫기
                            document.querySelectorAll('.action-panel').forEach(panel => {
                                if (panel !== thinkingPanel) {
                                    panel.style.display = 'none';
                                }
                            });
                            
                            // 이 패널 토글
                            if (thinkingPanel.style.display === 'none' || !thinkingPanel.style.display) {
                                thinkingPanel.style.display = 'block';
                            } else {
                                thinkingPanel.style.display = 'none';
                            }
                            
                            chatMessages.scrollTop = chatMessages.scrollHeight;
                        });
                        
                        thinkingContainer.appendChild(thinkingButton);
                        thinkingContainer.appendChild(thinkingPanel);
                        actionContainers.appendChild(thinkingContainer);
                    }
                    
                    // 출처 버튼 및 패널
                    if (data.documents && data.documents.length > 0) {
                        const sourcesContainer = document.createElement('div');
                        sourcesContainer.className = 'action-container';
                        
                        const sourcesButton = document.createElement('button');
                        sourcesButton.className = 'action-button';
                        sourcesButton.innerHTML = '<i class="fas fa-book"></i> 참고 문서';
                        
                        const sourcesPanel = document.createElement('div');
                        sourcesPanel.className = 'action-panel sources-panel';
                        
                        const sourcesList = document.createElement('ul');
                        sourcesList.className = 'sources-list';
                        
                        data.documents.forEach(source => {
                            const sourceItem = document.createElement('li');
                            sourceItem.textContent = source;
                            sourcesList.appendChild(sourceItem);
                        });
                        
                        sourcesPanel.appendChild(sourcesList);
                        
                        sourcesButton.addEventListener('click', function() {
                            // 모든 패널 닫기
                            document.querySelectorAll('.action-panel').forEach(panel => {
                                if (panel !== sourcesPanel) {
                                    panel.style.display = 'none';
                                }
                            });
                            
                            // 이 패널 토글
                            if (sourcesPanel.style.display === 'none' || !sourcesPanel.style.display) {
                                sourcesPanel.style.display = 'block';
                            } else {
                                sourcesPanel.style.display = 'none';
                            }
                            
                            chatMessages.scrollTop = chatMessages.scrollHeight;
                        });
                        
                        sourcesContainer.appendChild(sourcesButton);
                        sourcesContainer.appendChild(sourcesPanel);
                        actionContainers.appendChild(sourcesContainer);
                    }
                    
                    messageContent.appendChild(actionContainers);
                }
                
                messageGroup.appendChild(avatar);
                messageGroup.appendChild(messageContent);
                
                chatMessages.appendChild(messageGroup);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // 이벤트 리스너 등록
            sendButton.addEventListener('click', sendMessage);
            userInput.addEventListener('keydown', function(e) {
                // Shift+Enter는 줄바꿈, Enter는 전송
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (!sendButton.disabled) {
                        sendMessage();
                    }
                }
            });
        });
    </script>
</body>
</html>
